<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180">
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#06b6d4"/>
    <stop offset=".5" stop-color="#7c3aed"/>
    <stop offset="1" stop-color="#c026d3"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="180" rx="28" fill="#09001a"/>
<path d="M0 135 Q150 85 300 130 T600 120 T900 135 T1200 100" fill="none" stroke="url(#g)" stroke-width="3" opacity=".8">
  <animate attributeName="d" dur="7s" repeatCount="indefinite"
    values="M0 135 Q150 85 300 130 T600 120 T900 135 T1200 100;
            M0 105 Q150 150 300 105 T600 135 T900 95 T1200 125;
            M0 135 Q150 85 300 130 T600 120 T900 135 T1200 100"/>
</path>
<g fill="none" stroke="#67e8f9" opacity=".35">
  <circle cx="140" cy="45" r="22"><animate attributeName="r" values="18;28;18" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="55" r="30"><animate attributeName="r" values="30;18;30" dur="3.1s" repeatCount="indefinite"/></circle>
</g>
<g fill="#a78bfa" filter="url(#glow)">
  <circle cx="210" cy="92" r="3"><animate attributeName="cy" values="92;65;92" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="960" cy="105" r="3"><animate attributeName="cy" values="105;75;105" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<text x="600" y="72" text-anchor="middle" fill="#fff" font-family="monospace" font-size="27" font-weight="700">AI LAB // SYSTEM ONLINE</text>
<text x="600" y="105" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="16">VISION • NLP • AUDIO • EFFICIENT AI</text>
</svg>